<!DOCTYPE html>
<html>
<head>

    <title>Explore Bangladesh | Traveler Registration</title>
</head>
<body>

            <center>

                <h1>Traveler Registration</h1>

            </center>
            <br>
        <br><br>
        
            <form action="#" method="post">
                <fieldset><legend>Personal Information</legend>
                    
                        <label for="full-name">Full Name:</label><br><input type="text" id="full-name" name="full_name" required><br><br>
                        <label for="email">Email Address:</label><br><input type="email" id="email" name="email" required><br><br>
                        <label for="phone">Phone Number:</label><br><input type="tel" id="phone" name="phone" required><br><br>
                        <label for="birth-date">Date of Birth:</label><br><input type="date" id="birth-date" name="birth_date" required><br><br>
                        Gender (optional):<br>
                            <input type="radio" id="gender-male" name="gender" value="Male"><label for="gender-male">Male</label>
                            <input type="radio" id="gender-female" name="gender" value="Female"><label for="gender-female">Female</label>
                            <input type="radio" id="gender-other" name="gender" value="Other"><label for="gender-other">Other</label>
                        <br><br>
                    <br><br>
                </fieldset>
                <br>
                <fieldset><legend>Account Information</legend>
                    
                        <label for="password">Password:</label><br><input type="password" id="password" name="password" required><br><br>
                        <label for="confirm-password">Confirm Password:</label><br><input type="password" id="confirm-password" name="confirm_password" required><br><br>
                    <br><br>
                </fieldset>
                <br>
                <fieldset><legend>Travel Preferences</legend>
                    
                        <input type="checkbox" id="beaches" name="preferences" value="Beaches"><label for="beaches">Beaches</label><br><input type="checkbox" id="hills" name="preferences" value="Mountains and hills"><label for="hills">Mountains and hills</label><br><br>
                        <input type="checkbox" id="forests" name="preferences" value="Forests and wildlife"><label for="forests">Forests and wildlife</label><br><input type="checkbox" id="historical" name="preferences" value="Historical places"><label for="historical">Historical places</label><br><br>
                        <input type="checkbox" id="culture" name="preferences" value="Cultural destinations"><label for="culture">Cultural destinations</label><br><input type="checkbox" id="adventure" name="preferences" value="Adventure tourism"><label for="adventure">Adventure tourism</label><br><br>
                    <br><br>
                </fieldset>
                <br>
                <fieldset><legend>Additional Information</legend>
                    
                        <label for="home-district">Home District:</label><br><input type="text" id="home-district" name="home_district" required><br><br>
                        <label for="introduction">Short Introduction (optional):</label><br><textarea id="introduction" name="introduction" rows="4" cols="35"></textarea><br><br>
                    <br><br>
                </fieldset>
                <p align="center"><input type="submit" value="Submit Registration"> <input type="reset" value="Reset"></p>
            </form>
        <br><br>
        <p align="center"><a href="../Login/login.html">Login</a> | <a href="../Register/register.html">Registration Options</a> | <a href="../Homepage/View/homepage.html">Homepage</a></p><br><br>
    <br><br>
</body>
</html>
