<!DOCTYPE html>
<html>
<head>

    <title>Explore Bangladesh | Admin Access Request</title>
</head>
<body>

                <center>

                    <h1>Admin Access Request</h1>

                </center>
            <br>
        <br>
        
            <form action="#" method="post">
                <fieldset>
                    <legend>Applicant Information</legend>
                    
                        <label for="applicant-name">Name:</label><br><input type="text" id="applicant-name" name="applicant_name" required><br><br>
                        <label for="official-email">Official Email:</label><br><input type="email" id="official-email" name="official_email" required><br><br>
                        <label for="phone">Phone:</label><br><input type="tel" id="phone" name="phone" required><br><br>
                        <label for="organization">Organization:</label><br><input type="text" id="organization" name="organization" required><br><br>
                        <label for="designation">Current Designation:</label><br><input type="text" id="designation" name="designation" required><br><br>
                        <label for="employee-id">Employee ID:</label><br><input type="text" id="employee-id" name="employee_id" required><br><br>
                    <br><br>
                </fieldset>
                <br>
                <fieldset>
                    <legend>Access Request</legend>
                    
                        <label for="requested-role">Requested Role:</label><br>
                            <select id="requested-role" name="requested_role" required>
                                <option value="">Select</option>
                                <option>Data Manager</option>
                                <option>User Manager</option>
                                <option>System Administrator</option>
                            </select>
                        <br><br>
                        <label for="reason">Reason for Request:</label><br><textarea id="reason" name="reason" rows="4" cols="35" required></textarea><br><br>
                        <label for="supporting-document">Supporting Document:</label><br><input type="file" id="supporting-document" name="supporting_document"><br><br>
                    <br><br>
                </fieldset>
                <br>
                <fieldset>
                    <legend>Confirmation</legend>
                    <p><input type="checkbox" id="confirm-accuracy" name="confirm_accuracy" required> <label for="confirm-accuracy">I confirm that the information provided is accurate.</label></p>
                </fieldset>
                <p align="center"><input type="submit" value="Submit"> <input type="reset" value="Reset"></p>
            </form>
        <br><br>
        <p align="center"><a href="../Login/login.html">Login</a> | <a href="../Register/register.html">Registration Options</a> | <a href="../Homepage/View/homepage.html">Homepage</a></p><br><br>

    <br><br>
</body>
</html>
