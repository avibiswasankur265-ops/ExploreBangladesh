<!DOCTYPE html>
<html>
<head>

    <title>Explore Bangladesh | Business Registration</title>
</head>
<body>

            <center>

                <h1>Hotel &amp; Restaurant Owner Registration</h1>

            </center>
            <br>
        <br><br>
        
            <form action="#" method="post">
                <fieldset><legend>Owner Information</legend>
                    
                        <label for="owner-name">Owner's Full Name:</label><br><input type="text" id="owner-name" name="owner_name" required><br><br>
                        <label for="owner-email">Email Address:</label><br><input type="email" id="owner-email" name="owner_email" required><br><br>
                        <label for="owner-phone">Phone Number:</label><br><input type="tel" id="owner-phone" name="owner_phone" required><br><br>
                        <label for="password">Password:</label><br><input type="password" id="password" name="password" required><br><br>
                        <label for="confirm-password">Confirm Password:</label><br><input type="password" id="confirm-password" name="confirm_password" required><br><br>
                    <br><br>
                </fieldset><br>
                <fieldset><legend>Business Information</legend>
                    
                        <label for="business-name">Business Name:</label><br><input type="text" id="business-name" name="business_name" required><br><br>
                        <label for="business-type">Business Type:</label><br><select id="business-type" name="business_type" required><option value="">Choose business type</option><option>Hotel</option><option>Resort</option><option>Restaurant</option><option>Other</option></select><br><br>
                        <label for="address">Business Address:</label><br><textarea id="address" name="address" rows="3" cols="35" required></textarea><br><br>
                        <label for="district">District:</label><br><input type="text" id="district" name="district" required><br><br>
                        <label for="contact-number">Business Contact Number:</label><br><input type="tel" id="contact-number" name="contact_number" required><br><br>
                        <label for="business-email">Business Email:</label><br><input type="email" id="business-email" name="business_email"><br><br>
                        <label for="description">Business Description:</label><br><textarea id="description" name="description" rows="4" cols="35" required></textarea><br><br>
                    <br><br>
                </fieldset><br>
                <fieldset><legend>Service Information</legend>
                    
                        <label for="room-types">Room Types (hotels/resorts):</label><br><input type="text" id="room-types" name="room_types"><br><br>
                        <label for="night-price">Estimated Price per Night (BDT):</label><br><input type="number" id="night-price" name="night_price" min="0"><br><br>
                        <label for="hotel-facilities">Hotel/Resort Facilities:</label><br><textarea id="hotel-facilities" name="hotel_facilities" rows="3" cols="35"></textarea><br><br>
                        <label for="cuisine">Cuisine Type (restaurants):</label><br><input type="text" id="cuisine" name="cuisine"><br><br>
                        <label for="food-cost">Average Food Cost per Person (BDT):</label><br><input type="number" id="food-cost" name="food_cost" min="0"><br><br>
                        <label for="hours">Opening Hours:</label><br><input type="text" id="hours" name="hours" placeholder="e.g. 9 AM - 10 PM"><br><br>
                        <label for="restaurant-facilities">Restaurant Facilities:</label><br><textarea id="restaurant-facilities" name="restaurant_facilities" rows="3" cols="35"></textarea><br><br>
                    <br><br>
                    <p>Complete the fields relevant to your business type.</p>
                </fieldset><br>
                <fieldset><legend>Business Images</legend>
                    
                        <label for="business-photo">Business Logo or Photo:</label><br><input type="file" id="business-photo" name="business_photo" accept="image/*"><br><br>
                        <label for="additional-photo">Additional Image (optional):</label><br><input type="file" id="additional-photo" name="additional_photo" accept="image/*"><br><br>
                    <br><br>
                </fieldset>
                <p align="center"><input type="submit" value="Submit Registration"> <input type="reset" value="Reset"></p>
            </form>
        <br><br>
        <p align="center"><a href="../Login/login.html">Login</a> | <a href="../Register/register.html">Registration Options</a> | <a href="../Homepage/View/homepage.html">Homepage</a></p><br><br>
    <br><br>
</body>
</html>
