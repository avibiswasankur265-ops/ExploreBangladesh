<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Bangladesh | Login</title>
</head>
<body>
    <table width="75%" align="center" cellpadding="10" cellspacing="0">
        <tr><td align="center">
            <h1>Explore Bangladesh</h1>
            <h2>Login</h2>
            
            <hr>
        </td></tr>
        <tr><td>
            <form action="#" method="post">
                <fieldset>
                    <legend>Account Details</legend>
                    <table width="100%" cellpadding="8" cellspacing="0">
                        <tr><td width="35%"><label for="email">Email Address:</label></td><td><input type="email" id="email" name="email" required></td></tr>
                        <tr><td><label for="password">Password:</label></td><td><input type="password" id="password" name="password" required></td></tr>
                        <tr><td><label for="account-type">Account Type:</label></td><td>
                            <select id="account-type" name="account_type" required>
                                <option value="">Select account type</option>
                                <option>Traveler</option><option>Tour Guide</option><option>Hotel &amp; Restaurant Owner</option><option>Administrator</option>
                            </select>
                        </td></tr>
                        <tr><td></td><td><input type="checkbox" id="remember" name="remember"> <label for="remember">Remember me</label></td></tr>
                        <tr><td colspan="2" align="center"><input type="submit" value="Login"> <input type="reset" value="Reset"></td></tr>
                    </table>
                </fieldset>
            </form>
        </td></tr>
        <tr><td align="center">
            <p><a href="../Homepage/View/homepage.html">Homepage</a> | <a href="../Register/register.html">Create an Account</a></p>
        </td></tr>
    </table>
</body>
</html>
